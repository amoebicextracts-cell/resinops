name: Scheduled Production Backup

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_BACKUP_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ubuntu's default "postgresql-client" package (and ubuntu-latest's
      # preinstalled /usr/bin/pg_dump wrapper) lags behind Supabase's
      # Postgres version (16.x vs. Supabase's 17.x) -- pg_dump refuses to run
      # against a newer server than itself. Installing postgresql-client-17
      # alone isn't enough since the preinstalled wrapper still shadows it on
      # PATH -- prepend the versioned binary directory via GITHUB_PATH so
      # later steps resolve `pg_dump` to 17, not the wrapper's 16.
      - name: Install PostgreSQL 17 client (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump resolves to the matching major version
        run: pg_dump --version

      - name: Run production backup
        run: node scripts/backup-production.mjs

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: resinops-production-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
