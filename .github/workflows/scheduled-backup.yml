name: Scheduled Production Backup

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_BACKUP_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client (pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run production backup
        run: node scripts/backup-production.mjs

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: resinops-production-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
